name: Build and Release GhostConv APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Automated Flutter Tests
        run: flutter test

      - name: Configure Keystore for CI
        run: |
          keytool -genkeypair -v -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ghostconv -storepass ghostconv123 -keypass ghostconv123 -dname "CN=GhostConv, OU=Mobile, O=GhostConv, L=Delhi, ST=Delhi, C=IN"
          echo "storePassword=ghostconv123" > android/key.properties
          echo "keyPassword=ghostconv123" >> android/key.properties
          echo "keyAlias=ghostconv" >> android/key.properties
          echo "storeFile=release.jks" >> android/key.properties

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true

